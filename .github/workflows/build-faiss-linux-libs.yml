name: Build FAISS Linux Libraries

on:
  workflow_dispatch:
    inputs:
      faiss-version:
        description: FAISS version tag to build without the leading "v"
        required: true
        default: "1.11.0"

permissions:
  contents: read

jobs:
  build-faiss:
    name: Build FAISS ${{ matrix.target }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            image: amazonlinux:2
            arch: amd64
            runner: ubuntu-latest
          - target: linux
            image: amazonlinux:2
            arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FAISS in baseline container
        shell: bash
        env:
          FAISS_VERSION: ${{ inputs.faiss-version }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          output_dir="$PWD/build/faiss-libs/$TARGET/$ARCH"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          docker run --rm \
            -e FAISS_VERSION \
            -e TARGET \
            -e ARCH \
            -v "$PWD:/work" \
            -w /work \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail

              cmake_version="3.29.8"
              openblas_version="0.3.26"
              source_dir="/tmp/faiss"
              build_dir="/tmp/faiss-build"
              install_dir="/tmp/faiss-install"
              openblas_dir="/tmp/openblas"
              openblas_build_dir="/tmp/openblas-build"
              openblas_prefix="/tmp/openblas-install"
              out_dir="/work/build/faiss-libs/$TARGET/$ARCH"

              install_deb_dependencies() {
                export DEBIAN_FRONTEND=noninteractive
                apt-get update
                apt-get install -y \
                  bash \
                  binutils \
                  build-essential \
                  ca-certificates \
                  curl \
                  git \
                  libgomp1 \
                  libopenblas-dev \
                  make \
                  tar
              }

              install_rpm_dependencies() {
                if command -v dnf >/dev/null 2>&1; then
                  dnf install -y \
                    bash \
                    binutils \
                    ca-certificates \
                    curl \
                    dnf-plugins-core \
                    findutils \
                    gcc \
                    gcc-c++ \
                    git \
                    libgomp \
                    make \
                    perl \
                    tar \
                    gzip \
                    which
                else
                  yum install -y \
                    bash \
                    binutils \
                    ca-certificates \
                    curl \
                    findutils \
                    gcc \
                    gcc-c++ \
                    git \
                    libgomp \
                    make \
                    perl \
                    tar \
                    gzip \
                    which
                fi
              }

              install_cmake() {
                machine="$(uname -m)"
                case "$machine" in
                  x86_64) cmake_arch="x86_64" ;;
                  aarch64) cmake_arch="aarch64" ;;
                  *)
                    echo "Unsupported machine for CMake binary: $machine" >&2
                    exit 1
                    ;;
                esac

                curl -fsSL \
                  "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/cmake-${cmake_version}-linux-${cmake_arch}.tar.gz" \
                  -o /tmp/cmake.tar.gz
                mkdir -p /opt/cmake
                tar -xzf /tmp/cmake.tar.gz --strip-components=1 -C /opt/cmake
                export PATH="/opt/cmake/bin:$PATH"
                cmake --version
              }

              build_openblas() {
                machine="$(uname -m)"
                case "$machine" in
                  x86_64)
                    openblas_target="CORE2"
                    ;;
                  aarch64)
                    openblas_target="ARMV8"
                    ;;
                  *)
                    echo "Unsupported machine for OpenBLAS build: $machine" >&2
                    exit 1
                    ;;
                esac

                curl -fsSL \
                  "https://github.com/OpenMathLib/OpenBLAS/releases/download/v${openblas_version}/OpenBLAS-${openblas_version}.tar.gz" \
                  -o /tmp/openblas.tar.gz
                mkdir -p "$openblas_dir" "$openblas_build_dir" "$openblas_prefix"
                tar -xzf /tmp/openblas.tar.gz --strip-components=1 -C "$openblas_dir"

                make -C "$openblas_dir" \
                  TARGET="$openblas_target" \
                  BINARY=64 \
                  NOFORTRAN=1 \
                  NO_SHARED=1 \
                  USE_OPENMP=0 \
                  USE_THREAD=0 \
                  DYNAMIC_ARCH=0 \
                  PREFIX="$openblas_prefix" \
                  -j"$(nproc)"
                make -C "$openblas_dir" \
                  TARGET="$openblas_target" \
                  BINARY=64 \
                  NOFORTRAN=1 \
                  NO_SHARED=1 \
                  USE_OPENMP=0 \
                  USE_THREAD=0 \
                  DYNAMIC_ARCH=0 \
                  PREFIX="$openblas_prefix" \
                  install

                test -f "$openblas_prefix/lib/libopenblas.a"
              }

              case "$TARGET" in
                linux)
                  install_rpm_dependencies
                  ;;
                *)
                  echo "Unsupported target: $TARGET" >&2
                  exit 1
                  ;;
              esac

              install_cmake
              build_openblas

              git clone --depth 1 --branch "v${FAISS_VERSION}" \
                https://github.com/facebookresearch/faiss.git "$source_dir"

              cmake -S "$source_dir" -B "$build_dir" \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$install_dir" \
                -DCMAKE_PREFIX_PATH="$openblas_prefix" \
                -DBUILD_SHARED_LIBS=ON \
                -DBUILD_TESTING=OFF \
                -DBLA_VENDOR=OpenBLAS \
                -DBLAS_LIBRARIES="$openblas_prefix/lib/libopenblas.a" \
                -DLAPACK_LIBRARIES="$openblas_prefix/lib/libopenblas.a" \
                -DFAISS_ENABLE_C_API=ON \
                -DFAISS_ENABLE_GPU=OFF \
                -DFAISS_ENABLE_PYTHON=OFF \
                -DFAISS_OPT_LEVEL=generic

              cmake --build "$build_dir" --parallel "$(nproc)"
              cmake --install "$build_dir"

              mkdir -p "$out_dir/lib" "$out_dir/include"
              cp -a "$install_dir"/lib*/libfaiss*.so* "$out_dir/lib/"
              cp -a "$install_dir/include/faiss" "$out_dir/include/"

              test -f "$out_dir/lib/libfaiss.so"
              test -f "$out_dir/lib/libfaiss_c.so"

              {
                echo "FAISS version: $FAISS_VERSION"
                echo "Target: $TARGET"
                echo "Architecture: $ARCH"
                echo "Image: /etc/os-release follows"
                cat /etc/os-release
                echo
                echo "Machine: $(uname -m)"
                echo "Built at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo
                echo "Library files:"
                find "$out_dir/lib" -maxdepth 1 -type f -o -type l | sort
                echo
                echo "libfaiss dependencies:"
                ldd "$out_dir/lib/libfaiss.so" || true
                echo
                echo "libfaiss_c dependencies:"
                ldd "$out_dir/lib/libfaiss_c.so" || true
                echo
                echo "libfaiss required symbol versions:"
                readelf -V "$out_dir/lib/libfaiss.so" || true
                echo
                echo "libfaiss_c required symbol versions:"
                readelf -V "$out_dir/lib/libfaiss_c.so" || true
              } > "$out_dir/manifest.txt"

              tar -C "$out_dir" -czf "/work/build/faiss-libs/faiss-${FAISS_VERSION}-${TARGET}-${ARCH}.tar.gz" .
            '

      - name: Upload FAISS libraries
        uses: actions/upload-artifact@v4
        with:
          name: faiss-${{ inputs.faiss-version }}-${{ matrix.target }}-${{ matrix.arch }}
          path: build/faiss-libs/faiss-${{ inputs.faiss-version }}-${{ matrix.target }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
